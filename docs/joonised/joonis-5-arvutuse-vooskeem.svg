<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 760" width="920" height="760" font-family="Segoe UI, Arial, sans-serif">
  <rect width="920" height="760" fill="#ffffff"/>
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5e544b"/>
    </marker>
  </defs>

  <text x="460" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#14201d">Kalkulaatori algoritm</text>
  <text x="460" y="56" text-anchor="middle" font-size="13" fill="#5e544b">CalculatorServices.Calculate() — mis juhtub ühe nupuvajutusega</text>

  <!-- 1 -->
  <rect x="300" y="80" width="320" height="52" rx="26" fill="#fdf1ec" stroke="#f2764b" stroke-width="2"/>
  <text x="460" y="104" text-anchor="middle" font-size="13.5" font-weight="600" fill="#14201d">Kasutaja täidab vormi</text>
  <text x="460" y="121" text-anchor="middle" font-size="11.5" fill="#5e544b">hoone tüüp, toad, pistikud, valgustid, pliit</text>
  <line x1="460" y1="132" x2="460" y2="158" stroke="#5e544b" stroke-width="2" marker-end="url(#ar)"/>

  <!-- 2 -->
  <rect x="290" y="162" width="340" height="46" rx="8" fill="#f6f3ef" stroke="#8a7a68" stroke-width="1.6"/>
  <text x="460" y="182" text-anchor="middle" font-size="13" font-weight="600" fill="#14201d">Loe andmebaasist arvutusreeglid</text>
  <text x="460" y="199" text-anchor="middle" font-size="11.5" fill="#5e544b">CalculationRules WHERE BuildingType = valitud tüüp</text>
  <line x1="460" y1="208" x2="460" y2="234" stroke="#5e544b" stroke-width="2" marker-end="url(#ar)"/>

  <!-- loop box -->
  <rect x="70" y="238" width="780" height="286" rx="12" fill="#fbfaf8" stroke="#c2b8ab" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text x="90" y="262" font-size="12.5" font-weight="700" fill="#8a5600">IGA REEGLI KOHTA (valgustus, pistikud, pliit)</text>

  <!-- 3 -->
  <rect x="150" y="276" width="620" height="60" rx="8" fill="#eef6f2" stroke="#0a6b4d" stroke-width="1.8"/>
  <text x="460" y="300" text-anchor="middle" font-size="13" font-weight="600" fill="#14201d">Arvuta ahelate arv</text>
  <text x="460" y="320" text-anchor="middle" font-size="12.5" fill="#0a6b4d">ahelaid = ÜLESPOOLE ümardatud ( tarbijate arv ÷ reegli jagaja )</text>
  <line x1="460" y1="336" x2="460" y2="360" stroke="#5e544b" stroke-width="2" marker-end="url(#ar)"/>

  <!-- 4 -->
  <rect x="150" y="364" width="620" height="52" rx="8" fill="#eef2f8" stroke="#1d5bb8" stroke-width="1.8"/>
  <text x="460" y="385" text-anchor="middle" font-size="13" font-weight="600" fill="#14201d">Vali kaitselüliti</text>
  <text x="460" y="403" text-anchor="middle" font-size="11.5" fill="#5e544b">õige kategooria ja nimivool · laos olev · odavaim</text>
  <line x1="460" y1="416" x2="460" y2="440" stroke="#5e544b" stroke-width="2" marker-end="url(#ar)"/>

  <!-- 5 -->
  <rect x="150" y="444" width="620" height="52" rx="8" fill="#eef2f8" stroke="#1d5bb8" stroke-width="1.8"/>
  <text x="460" y="465" text-anchor="middle" font-size="13" font-weight="600" fill="#14201d">Vali kaabel ja arvuta meetrid</text>
  <text x="460" y="483" text-anchor="middle" font-size="11.5" fill="#5e544b">õige ristlõige · kogus meetrites, mitte tükkides</text>

  <line x1="460" y1="524" x2="460" y2="550" stroke="#5e544b" stroke-width="2" marker-end="url(#ar)"/>

  <!-- 6 -->
  <rect x="290" y="554" width="340" height="46" rx="8" fill="#f6f3ef" stroke="#8a7a68" stroke-width="1.6"/>
  <text x="460" y="574" text-anchor="middle" font-size="13" font-weight="600" fill="#14201d">Lisa jaotuskilp ja rikkevoolukaitse</text>
  <text x="460" y="591" text-anchor="middle" font-size="11.5" fill="#5e544b">üks kummastki paigaldise kohta</text>
  <line x1="460" y1="600" x2="460" y2="624" stroke="#5e544b" stroke-width="2" marker-end="url(#ar)"/>

  <!-- 7 -->
  <rect x="290" y="628" width="340" height="46" rx="8" fill="#f6f3ef" stroke="#8a7a68" stroke-width="1.6"/>
  <text x="460" y="648" text-anchor="middle" font-size="13" font-weight="600" fill="#14201d">Arvuta summad ja salvesta arvutus</text>
  <text x="460" y="665" text-anchor="middle" font-size="11.5" fill="#5e544b">rea hind = kogus × ühikuhind</text>
  <line x1="460" y1="674" x2="460" y2="698" stroke="#5e544b" stroke-width="2" marker-end="url(#ar)"/>

  <!-- 8 -->
  <rect x="300" y="702" width="320" height="46" rx="23" fill="#fdf1ec" stroke="#f2764b" stroke-width="2"/>
  <text x="460" y="730" text-anchor="middle" font-size="13.5" font-weight="700" fill="#14201d">Materjalide loend (BOM) kasutajale</text>

  <!-- side note -->
  <rect x="640" y="276" width="0" height="0"/>
  <text x="90" y="292" font-size="11" fill="#8a5600">Näide:</text>
  <text x="90" y="309" font-size="11" fill="#5e544b">12 valgustit</text>
  <text x="90" y="325" font-size="11" fill="#5e544b">÷ 8 = 1,5</text>
  <text x="90" y="341" font-size="11" font-weight="700" fill="#0a6b4d">→ 2 ahelat</text>
  <text x="90" y="360" font-size="10.5" fill="#5e544b">Allapoole</text>
  <text x="90" y="374" font-size="10.5" fill="#5e544b">ümardamine</text>
  <text x="90" y="388" font-size="10.5" fill="#5e544b">annaks üle-</text>
  <text x="90" y="402" font-size="10.5" fill="#5e544b">koormatud ahela.</text>
</svg>
