<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" font-family="Segoe UI, Arial, sans-serif">
  <rect width="900" height="560" fill="#ffffff"/>

  <text x="450" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#14201d">Rakenduse arhitektuur — neli projekti</text>
  <text x="450" y="58" text-anchor="middle" font-size="13" fill="#5e544b">Nool tähendab „sõltub sellest“. Sõltuvused liiguvad ainult ühes suunas.</text>

  <!-- Web -->
  <rect x="60" y="90" width="780" height="88" rx="10" fill="#fdf1ec" stroke="#f2764b" stroke-width="2"/>
  <text x="80" y="118" font-size="15" font-weight="700" fill="#14201d">ElektriKalkulaator (veebiprojekt)</text>
  <text x="80" y="140" font-size="12.5" fill="#3f362f">Kontrollerid · Razor vaated · CSS ja JavaScript · wwwroot</text>
  <text x="80" y="160" font-size="12" fill="#5e544b">Võtab HTTP-päringu vastu, küsib teenuselt, kuvab tulemuse. Ei arvuta ise midagi.</text>

  <!-- ApplicationServices -->
  <rect x="60" y="212" width="780" height="88" rx="10" fill="#eef6f2" stroke="#0a6b4d" stroke-width="2"/>
  <text x="80" y="240" font-size="15" font-weight="700" fill="#14201d">ApplicationServices</text>
  <text x="80" y="262" font-size="12.5" fill="#3f362f">CalculatorServices · ProductServices · CategoryServices</text>
  <text x="80" y="282" font-size="12" fill="#5e544b">SIIN ELAB ÄRILOOGIKA. Ahelate arvutus, toodete valik, otsing ja filtreerimine.</text>

  <!-- Data -->
  <rect x="60" y="334" width="780" height="88" rx="10" fill="#eef2f8" stroke="#1d5bb8" stroke-width="2"/>
  <text x="80" y="362" font-size="15" font-weight="700" fill="#14201d">Data</text>
  <text x="80" y="384" font-size="12.5" fill="#3f362f">ElektriKalkulaatorContext (DbContext) · Migratsioonid · Algandmed</text>
  <text x="80" y="404" font-size="12" fill="#5e544b">Ainus koht, mis andmebaasiga räägib. Entity Framework Core tõlgib C#-i SQL-iks.</text>

  <!-- Core -->
  <rect x="60" y="456" width="780" height="76" rx="10" fill="#f6f3ef" stroke="#8a7a68" stroke-width="2"/>
  <text x="80" y="484" font-size="15" font-weight="700" fill="#14201d">Core</text>
  <text x="80" y="506" font-size="12.5" fill="#3f362f">Product · ProductCategory · CalculationRule · DTO-d · Teenuseliidesed</text>
  <text x="80" y="524" font-size="12" fill="#5e544b">Mõisted. EI SÕLTU MITTE MILLESTKI — see on reegel, mida ei tohi rikkuda.</text>

  <!-- arrows -->
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5e544b"/>
    </marker>
  </defs>
  <line x1="450" y1="178" x2="450" y2="206" stroke="#5e544b" stroke-width="2" marker-end="url(#a)"/>
  <line x1="450" y1="300" x2="450" y2="328" stroke="#5e544b" stroke-width="2" marker-end="url(#a)"/>
  <line x1="450" y1="422" x2="450" y2="450" stroke="#5e544b" stroke-width="2" marker-end="url(#a)"/>

  <!-- Tests -->
  <rect x="620" y="196" width="215" height="46" rx="8" fill="#fff8e6" stroke="#8a5600" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="727" y="216" text-anchor="middle" font-size="12.5" font-weight="700" fill="#14201d">Tests — 218 testi</text>
  <text x="727" y="233" text-anchor="middle" font-size="11" fill="#5e544b">viitab kõigile neljale</text>
</svg>
