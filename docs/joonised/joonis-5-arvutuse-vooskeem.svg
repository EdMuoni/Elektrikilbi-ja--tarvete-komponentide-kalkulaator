<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800" font-family="Segoe UI, Arial, sans-serif">
  <!-- Portrait layout so the figure can fill most of an A4 page with text of at least 10 pt.
       No title inside the image: the thesis caption names the figure.
       Steps 1-6 carry the same numbers as the numbered list in thesis section 1.4. -->
  <rect width="600" height="800" fill="#ffffff"/>
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#5e544b"/>
    </marker>
  </defs>

  <!-- start -->
  <rect x="110" y="10" width="380" height="58" rx="29" fill="#fdf1ec" stroke="#f2764b" stroke-width="2.2"/>
  <text x="300" y="36" text-anchor="middle" font-size="17" font-weight="600" fill="#14201d">Kasutaja täidab vormi</text>
  <text x="300" y="57" text-anchor="middle" font-size="14" fill="#5e544b">hoone tüüp, toad, pistikud, valgustid, pliit</text>
  <line x1="300" y1="68" x2="300" y2="92" stroke="#5e544b" stroke-width="2.2" marker-end="url(#ar)"/>

  <!-- 1 -->
  <rect x="60" y="96" width="480" height="58" rx="8" fill="#f6f3ef" stroke="#8a7a68" stroke-width="1.8"/>
  <text x="300" y="121" text-anchor="middle" font-size="17" font-weight="600" fill="#14201d">1. Loe andmebaasist arvutusreeglid</text>
  <text x="300" y="143" text-anchor="middle" font-size="14" fill="#5e544b">CalculationRules WHERE BuildingType = valitud tüüp</text>
  <line x1="300" y1="154" x2="300" y2="178" stroke="#5e544b" stroke-width="2.2" marker-end="url(#ar)"/>

  <!-- loop -->
  <rect x="20" y="182" width="560" height="354" rx="12" fill="#fbfaf8" stroke="#c2b8ab" stroke-width="1.8" stroke-dasharray="7 5"/>
  <text x="40" y="208" font-size="14" font-weight="700" fill="#8a5600">IGA REEGLI KOHTA (valgustid, pistikud, pliit)</text>

  <!-- 2 -->
  <rect x="40" y="222" width="520" height="66" rx="8" fill="#eef6f2" stroke="#0a6b4d" stroke-width="2"/>
  <text x="300" y="249" text-anchor="middle" font-size="17" font-weight="600" fill="#14201d">2. Arvuta ahelate arv</text>
  <text x="300" y="274" text-anchor="middle" font-size="14" fill="#0a6b4d">ahelaid = ülespoole ümardatud (tarbijate arv ÷ reegli jagaja)</text>
  <line x1="300" y1="288" x2="300" y2="308" stroke="#5e544b" stroke-width="2.2" marker-end="url(#ar)"/>

  <!-- 3 -->
  <rect x="40" y="312" width="520" height="58" rx="8" fill="#eef2f8" stroke="#1d5bb8" stroke-width="2"/>
  <text x="300" y="337" text-anchor="middle" font-size="17" font-weight="600" fill="#14201d">3. Vali kaitselüliti</text>
  <text x="300" y="359" text-anchor="middle" font-size="14" fill="#5e544b">õige kategooria ja nimivool · laos olev · odavaim</text>
  <line x1="300" y1="370" x2="300" y2="390" stroke="#5e544b" stroke-width="2.2" marker-end="url(#ar)"/>

  <!-- 4 -->
  <rect x="40" y="394" width="520" height="58" rx="8" fill="#eef2f8" stroke="#1d5bb8" stroke-width="2"/>
  <text x="300" y="419" text-anchor="middle" font-size="17" font-weight="600" fill="#14201d">4. Vali kaabel ja arvuta meetrid</text>
  <text x="300" y="441" text-anchor="middle" font-size="14" fill="#5e544b">õige ristlõige · kogus meetrites, mitte tükkides</text>

  <!-- worked example inside the loop -->
  <text x="40" y="490" font-size="14" fill="#5e544b">Näide: 12 valgustit ÷ 8 = 1,5 <tspan font-weight="700" fill="#0a6b4d">→ 2 ahelat</tspan></text>
  <text x="40" y="514" font-size="14" fill="#5e544b">Allapoole ümardamine annaks ühe ülekoormatud ahela.</text>
  <line x1="300" y1="536" x2="300" y2="562" stroke="#5e544b" stroke-width="2.2" marker-end="url(#ar)"/>

  <!-- 5 -->
  <rect x="90" y="566" width="420" height="58" rx="8" fill="#f6f3ef" stroke="#8a7a68" stroke-width="1.8"/>
  <text x="300" y="591" text-anchor="middle" font-size="17" font-weight="600" fill="#14201d">5. Lisa jaotuskilp ja rikkevoolukaitse</text>
  <text x="300" y="613" text-anchor="middle" font-size="14" fill="#5e544b">üks kummastki paigaldise kohta</text>
  <line x1="300" y1="624" x2="300" y2="644" stroke="#5e544b" stroke-width="2.2" marker-end="url(#ar)"/>

  <!-- 6 -->
  <rect x="90" y="648" width="420" height="58" rx="8" fill="#f6f3ef" stroke="#8a7a68" stroke-width="1.8"/>
  <text x="300" y="673" text-anchor="middle" font-size="17" font-weight="600" fill="#14201d">6. Arvuta summad ja salvesta arvutus</text>
  <text x="300" y="695" text-anchor="middle" font-size="14" fill="#5e544b">rea hind = kogus × ühikuhind</text>
  <line x1="300" y1="706" x2="300" y2="728" stroke="#5e544b" stroke-width="2.2" marker-end="url(#ar)"/>

  <!-- end -->
  <rect x="110" y="732" width="380" height="56" rx="28" fill="#fdf1ec" stroke="#f2764b" stroke-width="2.2"/>
  <text x="300" y="766" text-anchor="middle" font-size="17" font-weight="700" fill="#14201d">Materjalide loend (BOM) kasutajale</text>
</svg>
